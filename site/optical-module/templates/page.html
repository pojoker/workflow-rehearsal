<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{{META_DESCRIPTION}}">
  <title>{{PAGE_TITLE}}｜光模块知识体系</title>
  <link rel="stylesheet" href="assets/content.css?v={{CONTENT_CSS_VERSION}}">
  <link rel="stylesheet" href="assets/site-shell.css?v={{SITE_SHELL_CSS_VERSION}}">
</head>
<body data-page="{{PAGE_ID}}">
  <header class="site-header">
    <a class="site-brand" href="index.html"><span class="brand-mark">OM</span><span><b>光模块知识体系</b><small>模块化重构版 · 2026-08-31</small></span></a>
    <nav class="global-nav" aria-label="主题模块">{{GLOBAL_NAV}}</nav>
    <div class="canonical-pill">研究草案 · canonical 仍为 0</div>
  </header>

  <main class="site-frame">
    <header class="module-hero">
      <div><span class="module-number">{{PAGE_NUMBER}}</span><span class="module-kicker">{{PAGE_KICKER}}</span></div>
      <h1>{{PAGE_TITLE}}</h1>
      <p>{{PAGE_DESCRIPTION}}</p>
    </header>

    <div class="module-layout">
      {{LOCAL_NAV}}
      <div class="module-content">{{BODY}}</div>
    </div>

    {{PREV_NEXT}}
  </main>

  <footer class="site-footer"><span>光模块知识体系 · {{EDITION}}</span><span>展示层重构，不改变知识库状态</span></footer>
  <script src="assets/site.js?v={{SITE_JS_VERSION}}"></script>
</body>
</html>
