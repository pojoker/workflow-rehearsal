<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">光模块制造与装配分层图</title>
  <desc id="desc">上游分别制造电芯片、光器件、硅光芯片和微光学件，模块厂完成贴装、电互连、光学对准、散热、封装和测试。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#087d78"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#18242d}.h{font-size:28px;font-weight:700;fill:#fff}.sub{font-size:14px;fill:#cfe4e3}.group{font-size:17px;font-weight:700;fill:#102f3b}.step{font-size:12px;font-weight:700}.note{font-size:11px;fill:#63727d}.arrow{stroke:#087d78;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="650" rx="26" fill="#f6f8f5"/><rect width="1200" height="104" rx="26" fill="#102f3b"/><rect y="78" width="1200" height="26" fill="#102f3b"/>
  <text x="48" y="47" class="h">先造零件，再把零件连接成模块</text><text x="48" y="77" class="sub">制造设备回答“零件怎样出现”；装配设备回答“零件怎样成为可工作的整机”。</text>
  <g transform="translate(48 132)">
    <rect width="1104" height="318" rx="20" fill="#fff" stroke="#dce2da"/><text x="24" y="38" class="group">A. 零件制造：四条并行上游链</text>
    <g transform="translate(24 64)"><rect width="1056" height="50" rx="12" fill="#f1f5f2"/><text x="16" y="31" class="step">电芯片</text><text x="146" y="31" class="note">硅晶圆</text><line x1="225" y1="25" x2="290" y2="25" class="arrow"/><text x="315" y="31" class="note">CMOS / SiGe 工艺</text><line x1="470" y1="25" x2="535" y2="25" class="arrow"/><text x="560" y="31" class="note">封装</text><line x1="645" y1="25" x2="710" y2="25" class="arrow"/><text x="735" y="31" class="note">高速电测试</text></g>
    <g transform="translate(24 126)"><rect width="1056" height="50" rx="12" fill="#fff3df"/><text x="16" y="31" class="step">EML / PD</text><text x="146" y="31" class="note">InP 外延</text><line x1="225" y1="25" x2="290" y2="25" class="arrow"/><text x="315" y="31" class="note">光刻 / 刻蚀 / 金属化</text><line x1="500" y1="25" x2="565" y2="25" class="arrow"/><text x="590" y="31" class="note">切片 / 端面处理</text><line x1="740" y1="25" x2="805" y2="25" class="arrow"/><text x="830" y="31" class="note">LIV / 光谱测试</text></g>
    <g transform="translate(24 188)"><rect width="1056" height="50" rx="12" fill="#edf2fb"/><text x="16" y="31" class="step">SiPh PIC</text><text x="146" y="31" class="note">硅晶圆</text><line x1="225" y1="25" x2="290" y2="25" class="arrow"/><text x="315" y="31" class="note">波导 / 调制 / 探测结构</text><line x1="525" y1="25" x2="590" y2="25" class="arrow"/><text x="615" y="31" class="note">晶圆级筛选</text><line x1="735" y1="25" x2="800" y2="25" class="arrow"/><text x="825" y="31" class="note">光电联合测试</text></g>
    <g transform="translate(24 250)"><rect width="1056" height="50" rx="12" fill="#f1f5f2"/><text x="16" y="31" class="step">微光学 / FAU</text><text x="146" y="31" class="note">玻璃 / 光纤</text><line x1="245" y1="25" x2="310" y2="25" class="arrow"/><text x="335" y="31" class="note">成型 / 排列 / 固定</text><line x1="500" y1="25" x2="565" y2="25" class="arrow"/><text x="590" y="31" class="note">研磨 / 镀膜</text><line x1="710" y1="25" x2="775" y2="25" class="arrow"/><text x="800" y="31" class="note">几何与光学检测</text></g>
  </g>
  <line x1="600" y1="460" x2="600" y2="500" class="arrow"/>
  <g transform="translate(48 510)"><rect width="1104" height="104" rx="20" fill="#102f3b"/><text x="24" y="34" style="font-size:17px;font-weight:700;fill:#fff">B. 模块装配：把多条上游链闭合成一只产品</text>
    <g transform="translate(24 52)"><text x="0" y="24" style="font-size:12px;font-weight:700;fill:#fff">SMT / die attach</text><text x="176" y="24" style="font-size:16px;fill:#87c9c2">→</text><text x="213" y="24" style="font-size:12px;font-weight:700;fill:#fff">高速电互连</text><text x="354" y="24" style="font-size:16px;fill:#87c9c2">→</text><text x="391" y="24" style="font-size:12px;font-weight:700;fill:#fff">光学对准与固定</text><text x="557" y="24" style="font-size:16px;fill:#87c9c2">→</text><text x="594" y="24" style="font-size:12px;font-weight:700;fill:#fff">散热与封装</text><text x="722" y="24" style="font-size:16px;fill:#87c9c2">→</text><text x="759" y="24" style="font-size:12px;font-weight:700;fill:#fff">校准 / 老化 / 终测</text></g>
  </g>
</svg>
