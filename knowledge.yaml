- id: KN002
  格: [EQ8, D1, D2, D3, D4, D12]
  标题: 气密封装 vs 非气密——不是技术高低，是电信和数通两条路线的分野
  一句话: |
    把芯片用金属或陶瓷外壳密封起来、隔绝水汽，叫气密封装。
    电信设备要用它（要在户外扛十几年），数据中心不用（成本优先、机房环境可控）。
    所以"气密封装设备"这个环节只属于电信路线，数通路线根本不经过。
  说细点: |
    光芯片怕水汽。水汽进去，芯片会慢慢失效。解决办法是把芯片封在一个密闭腔体里，
    行业里叫"气密封装"，常见做法是金属外壳配平行缝焊，或者陶瓷管壳配同轴封装（就是常说的 TO-CAN）。

    但气密封装贵：要金属/陶瓷外壳，要专门的封焊设备，工序也多。

    数据中心的光模块选了另一条路——直接把裸芯片贴在电路板上、打线连接，不做密封，
    行业里叫 COB（板上芯片）。机房环境干净可控，模块换代又快，不需要为十几年寿命买单。

    所以同一个"封装"环节，两条路线走的是两套工艺、两套设备、两套材料：
      电信/接入路线 → 气密 → 金属外壳、陶瓷管壳、平行缝焊设备
      数通路线      → 非气密 → COB、氮化铝薄膜基板（低成本方案）

    这解释了产业结构图上一个现象：气密封装设备（EQ8）和 TOSA/ROSA/BOSA、陶瓷管壳
    这几个格子都挂在"电信气密"路线下，而数通路线的格子里是光引擎/COB组件。
    它们不是竞争关系，是两条路线各走各的。
  怎么用它判断: |
    看到"气密封装"四个字先分清三种角色，只有第三种才算 EQ8：
      ① 产品是气密封装的光模块 → 那是模块厂（MOD格）
      ② 卖气密封装用的外壳/基板 → 那是材料厂（D4/B2格）
      ③ 造封焊设备的 → 才是 EQ8
    2026-07-26 扫到的 6 家候选全是①②，所以 EQ8 至今是空的。
  证据:
  - 谁: 东山精密
    原话: 400G QDD FR4 面向电信市场高可靠性400G产品的性能方案验证……Gen3.5 Hermetic……QDD气密封装光模块
    出处: 2025年年度报告·主要研发项目表
    锚型: url
    锚: https://static.cninfo.com.cn/finalpage/2026-04-22/1225139318.PDF
    说明: 气密封装的研发项目，目的一栏直接写"面向电信市场高可靠性"——气密对应电信，原文自证
  - 谁: 中瓷电子
    原话: 全球新一轮AI技术爆发带动算力需求激增，直接拉动了数据中心建设和升级，从而对光模块产生了爆炸性需求。作为光模块封装关键材料，陶瓷外壳和基板市场需求快速增长，特别是氮化铝薄膜基板作为低成本非气密封装方案的关键封装材料呈现供不应求的情况
    出处: 2025年年度报告·行业情况
    锚型: url
    锚: https://static.cninfo.com.cn/finalpage/2026-04-29/1225224991.PDF
    说明: AI数据中心需求拉动的是"低成本非气密封装方案"——数通对应非气密，原文自证
  - 谁: 联特科技
    原话: TO-CAN指同轴气密封装后的管芯；COB指chip on board缩写，板上芯片封装，一种光器件的封装工艺
    出处: 2025年年度报告·释义章节
    锚型: url
    锚: https://static.cninfo.com.cn/finalpage/2026-04-29/1225239616.pdf
    说明: 两种封装方式的定义，来自模块厂自己的释义表
  - 谁: 宇宙外排查（负证据,A股激光焊接设备两龙头）
    原话: （无光模块语义命中——大族激光"气密"仅指消费电子防水气密性检测设备;联赢激光"缝焊"仅指圆柱电池正极缝焊）
    出处: 联赢激光688518/大族激光002008 2025年年度报告全文
    锚型: search_protocol
    锚: {关键词: '缝焊；封焊；气密；光模块；光通信；密封焊接', 语料范围: 两家2025年报剥空白全文(scratchpad探针,未入corpus分母), 检索日期: '2026-07-26', 命中数: '光模块/光通信/封焊/密封焊接=0；气密1次(防水检测语义)；缝焊1次(电池语义)'}
  关联点: []
