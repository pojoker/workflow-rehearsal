- id: KN006
  格: [D8]
  标题: PLC/AWG 平面波导——用做芯片的方法做"光的分岔路口"
  一句话: |
    把光按波长分开或按路数分开的器件（分路器/波分复用器），主流做法是在石英衬底上
    用光刻+刻蚀"画"出光的通道——跟做集成电路一个思路，所以良率和成本也吃同一套工艺功夫。
  说细点: |
    仕佳光子招股书把工艺流程写得很具体：在石英衬底上生长掺锗的二氧化硅芯层，
    经光刻、干法刻蚀形成波导结构，再生长掺硼/磷的二氧化硅上包层并退火致密化——
    光就在折射率略高的芯层通道里走，像电流走导线。

    做完的晶圆切割成巴条、抛光、再切成单个芯片，跟光纤阵列对光耦合、紫外胶固化，
    才成为可用的器件。

    设计能力直接决定成本：仕佳的例子是把传统 1×2 级联结构改成三分支+Y分支组合，
    少一级级联，芯片长度缩短 15%——结构创新直接变成成本优势。
  怎么用它判断: |
    这一格的门槛在"晶圆级工艺"：有自己的光刻/刻蚀波导产线才是芯片厂；
    只买晶圆做切割封装的是器件组装厂，证据里要分清说的是哪一段。
  证据:
  - 谁: 仕佳光子
    原话: 石英衬底上生长掺Ge二氧化硅芯层，经光刻、干法刻蚀形成Y分支级联分路结构，继续生长掺B、P等二氧化硅上包层并退火致密化，形成平面光路（PLC）分路器晶圆
    出处: 招股说明书（注册稿）·释义章节
