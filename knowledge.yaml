meta:
  version: v2
  用途: |
    知识库——回答"这个环节到底是干嘛的、为什么难、怎么判断谁够格"。
    与其他文件的分工：
      tree.yaml  = 产业由哪些环节构成（纯骨架：ID/名称/父子/粗粒度路线/流向/状态，免锚）
      points.csv = 每个环节谁在做（须自家披露件引语+锚）
      knowledge.yaml = 为什么。每条须有证据引语+可核验锚，没证据的常识不写这里。
    编号约定：知识 KN###；宏观量化结论 MC###（macro_evidence.csv）；路线BOM行 RB###（route_bom.csv）。
    历史 point/edge 保持 P###/E### 不迁移（向后兼容）。
  锚型: |
    每条证据必须声明锚型，校验器（不变量⑧）按型核验，"已核验"三个字过不了闸：
      url             锚必须是 http(s) 链接
      local_file      锚格式 "路径#章节或页码定位"，路径必须真实存在于仓库
      ledger_ref      锚必须是真实存在的 point_id / edge_id
      search_protocol 负证据专用：锚为映射，须含 关键词/语料范围/检索日期/命中数 四键
      web_snapshot    官网规格证据专用(只入知识库,不得为点锚)：锚为映射，须含 原URL/存档路径/抓取日期，存档必须真实存在于 corpus/web/
  写法要求: |
    一句话/说细点 必须是不懂行的人能看懂的大白话：不用未解释的缩写，
    先说是什么、再说为什么难，数字要有对比对象。写完自问一句
    "我妈能看懂吗"，看不懂就重写。

knowledge:

- id: KN001
  格: [EQ3]
  标题: 共晶固晶——把光芯片粘到板子上，粘歪几微米整个模块就废了
  一句话: |
    做光模块的第一步，是把激光器芯片用焊料"焊"在基板上。干这活的机器叫共晶固晶机。
    同名的机器，做显示屏的和做光模块的，精度差一个数量级——不是一档货。
  说细点: |
    光模块里有好几种芯片要贴：发光的激光器芯片、收光的探测器芯片、还有驱动和放大用的电芯片。
    它们要先被精确地固定在基板上，后面才能接线、对光、测试。

    为什么光模块这道工序特别难，有两个原因：
    一是激光器芯片本身发热厉害又怕热，焊接时温度控制不好就伤芯片；
    二是它贴的位置直接决定后面"光学耦合"能不能对上——光是走直线的，芯片偏几微米，
    光就射不进光纤了，整个模块报废。

    所以精度要求是这样的量级：光模块专用的共晶贴片设备，设备精度 ±1 微米、产品精度 ±3 微米。
    而做显示屏的贴合设备，指标是 ±0.05 毫米（也就是 ±50 微米）——差 15 倍以上。
  怎么用它判断: |
    一家公司说自己"造固晶机"，不等于它能造光模块用的那一档。准入两条路（满足其一）：
      ① 有直接的光通信应用或客户证据（明说用于光模块/光芯片，或客户是光模块厂）；
      ② 同时具备三样：微米级精度指标（±1~3µm 量级）+ 适配的工艺对象（激光器/光芯片贴装）
        + 光器件/激光器应用描述。
    只有精度、没有光通信场景的，记"相邻能力观察"，不得入"生产中"能力点——
    不是因为它没提"光"，而是没有任何证据表明它做的是这一档、卖给这个市场。
  证据:
  - 谁: 猎奇智能（专做光模块封测设备，科创板IPO在审）
    原话: 在光模块封测过程中，将激光器驱动芯片、跨阻放大器芯片、激光器芯片、探测器芯片等各类芯片通过特定的粘合剂（共晶焊料/导电胶/紫外胶）将各类芯片精确地固定在PCB上
    出处: 招股说明书（申报稿）·释义章节
    锚型: local_file
    锚: corpus/legacy-input/lieqi_prospectus.txt#释义章节·贴片条目
  - 谁: 猎奇智能
    原话: 共晶贴片设备的设备精度达到±1µm，产品精度达到±3µm，技术水平与国际龙头齐平……公司设备已广泛应用于中际旭创、光迅科技、索尔思、源杰科技等光模块、光芯片龙头厂商
    出处: 招股说明书（申报稿）·核心竞争力
    锚型: local_file
    锚: corpus/legacy-input/lieqi_prospectus.txt#核心竞争力章节
  - 谁: 猎奇智能（已在账本）
    原话: 光通信/半导体/汽车自动化等领域智能生产装备；产品应用于贴片、光学耦合、老化测试三核心环节
    出处: points.csv 已过闸能力点
    锚型: ledger_ref
    锚: P055
  - 谁: 联得装备（反例：造固晶机但档次未证）
    原话: 已完成高精度显示芯片倒装键合机、高速共晶固晶机、软焊料固晶机、AOI检测、引线框架贴膜和检测设备的研发，并形成销售订单
    出处: 2025年年度报告·管理层讨论与分析
    锚型: local_file
    锚: corpus/annual/300545/300545/300545__em_联得装备_em__2025_2025年年度报告.pdf.txt#管理层讨论与分析·半导体设备段
    说明: 全年报11处微米级指标全部是显示类（绑定精度±4µm、贴合精度±0.05mm、边缘直线度±50µm），固晶机未给精度；应用对象自述为TFT-LCD/OLED/MiniLED/车载屏；全篇"光通信/光模块/光电子/硅光/激光器"零提及——按本条判断法记"相邻能力观察"
  关联点: [P055]
  关联判例: 联得装备（triage 待判→按本条判断法应记"相邻能力观察"）
