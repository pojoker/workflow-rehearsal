- id: KN009
  体系: 物理知识
  研究问题: [PQ001]
  格: []
  标题: 先看两侧接口——模块把主机侧高速电信号接到远端介质
  一句话: |
    对采用 CMIS 管理的传输模块，主机一侧是高速电接口，远端一侧是高速电或光接口，
    模块的应用功能负责把两侧接起来。
  说细点: |
    CMIS 把与传输任务直接相关的物理接口分成两侧：Host Interface 位于模块和主机系统之间，
    是高速电接口；Media Interface 位于模块和远端介质之间，可以是高速电接口，也可以是光接口。
    模块中的 Application 是连接主机侧和介质侧的桥接或转发功能。

    这里说的是 CMIS 管理的 transmission module，不是所有光模块的统一定义。
    CMIS 还使用低速双线通信来做主机到模块的管理，但它和承载业务数据的高速接口不是一回事。
    这套接口骨架也没有直接规定外壳、机笼、连接器、散热器或内部零件清单。
  怎么用它判断: |
    研究一个模块时先把“高速业务接口”和“低速管理接口”分开，再分别标出主机侧与介质侧；
    只有确认对象受 CMIS 管理时，才可直接套用这里的术语。
  证据:
    - 谁: Optical Internetworking Forum（OIF）
      原话: （忠实转述，非逐字引文）Host Interface 是模块与主机系统之间的高速电接口；Media Interface 是模块与连接远端节点的介质之间的高速电或光接口；Application 描述主机侧与介质侧接口电路之间的桥接或转发功能。
      出处: OIF-CMIS-05.4·§6.1.1、§6.1.2、§6.2.1.1
      锚型: web_snapshot
      锚:
        原URL: https://www.oiforum.com/wp-content/uploads/OIF-CMIS-05.4.pdf
        存档路径: corpus/web/2026-08-23/oiforum.com__OIF-CMIS-05.4.pdf
        抓取日期: '2026-08-23'
        SHA256: cd57ebb1cfb8e0a9e9c7b63862b5b261855e9b77844f4cf85bd36ea3808911db
      说明: 仅用于CMIS管理的传输模块_不扩张到全部光模块
  录入日期: '2026-08-31'

- id: KN010
  体系: 物理知识
  研究问题: [PQ001]
  格: []
  标题: 外壳不是定义——可插拔 OSFP 和 CPO 有不同机械边界
  一句话: |
    OSFP 模块通过金手指和外壳接入主机连接器与机笼；OIF 的一种 3.2T CPO 模块则靠近交换芯片，
    可共基板或嵌在板上并用尾纤接出，所以前面板机笼不是所有光模块的必要条件。
  说细点: |
    在 OSFP 这种前面板可插拔形态中，模块电路板的金手指与主机连接器配合，模块外壳与主机机笼配合。
    这是一个清楚、可替换的机械边界，但它只描述 OSFP/OSFP-RHS 家族。

    OIF 的 3.2T 共封装模块规范给出了另一种实例：光模块靠近交换芯片，可与芯片同处一个共封装基板
    但仍是不同对象，也可以嵌在系统板上；光侧以尾纤引出，最终光连接器的位置和实现没有被该规范固定。

    因而判定“是不是光模块”时，不能先把前面板盒子、机笼或金手指当成必要条件。
    这也不等于所有 CPO 都采用同一种结构，更不能把交换芯片或整块基板算进光模块本体。
  怎么用它判断: |
    先按具体规范或产品资料画出模块与主机、介质的接口，再标机械边界；
    不要把某一种可插拔形态的机笼、金手指和散热结构拼成所有光模块的共同零件表。
  证据:
    - 谁: OSFP MSA
      原话: （忠实转述，非逐字引文）规范分别定义模块机械形态、主机机笼及配套连接器和主机 PCB 布局；模块 PCB 的接触垫与 §5.10 规定的连接器配合。
      出处: OSFP Module Specification Rev 5.22·§1、§3.5、§15
      锚型: web_snapshot
      锚:
        原URL: https://www.osfpmsa.org/assets/pdf/OSFP_Module_Specification_Rev5_22.pdf
        存档路径: corpus/web/2026-08-23/osfpmsa.org__OSFP_Module_Specification_Rev5_22.pdf
        抓取日期: '2026-08-23'
        SHA256: c8e80dda50e85b1d4ec96c88642d8a9ed0ed254124f9442f20c51559533850eb
      说明: 仅用于OSFP/OSFP-RHS实例_不推广为全部光模块
    - 谁: Optical Internetworking Forum（OIF）
      原话: （忠实转述，非逐字引文）光模块为交换芯片把短距电接口转换为光输入输出；模块可沿基板周边布置或嵌在板上，并以尾纤引出；该协议未固定光连接器实现。
      出处: OIF-Co-Packaging-3.2T-Module-01.0·§1、架构图、§6
      锚型: web_snapshot
      锚:
        原URL: https://www.oiforum.com/wp-content/uploads/OIF-Co-Packaging-3.2T-Module-01.0.pdf
