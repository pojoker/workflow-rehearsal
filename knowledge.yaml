    锚: corpus/legacy-input/v16/prospectus/688313_仕佳光子_招股说明书_注册稿.txt#释义章节·PLC分路器晶圆条目
  - 谁: 仕佳光子
    原话: 公司在设计中采用三分支和Y分支组合树型级联……与传统结构相比该新颖结构减少一级级联，使传统1×5芯片长度缩短15%，使芯片更加紧凑，大大降低了芯片成本
