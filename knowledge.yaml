- id: KN005
  格: [C1, M2a]
  标题: 激光器芯片怎么造——一条八步的完整工艺线，外延是第一步也是命门
  一句话: |
    一颗激光器芯片从无到有要过八道工序：先在衬底上"长"出发光的晶体层（外延），
    再刻出光栅和波导，镀膜、切割、测试、老化。全国能把这条线完整走下来的公司屈指可数。
  说细点: |
    仕佳光子的年报把这条线写得很全：外延生长 → 光栅制作 → 条形刻蚀 → 端面镀膜 →
    划片裂片 → 特性测试 → 封装筛选 → 芯片老化。它自述是"国内少数"掌握完整工艺线的公司——
    "完整"两个字就是门槛：八步里每一步都可能把良率打下去。

    第一步外延最关键。芯片的发光结构有两种做法（源杰科技年报的释义）：
    "脊波导型"——刻一条长方形的脊，工艺相对高效，10G 及以上主流速率都用它；
    "掩埋型"——把发光层用外延材料整个埋起来，电注入效率高、功耗低，
    但要做多次外延再生长，难度更高。

    这就是为什么"外延"在结构图上是独立环节（M2a）：它不是激光器芯片制造的附属步骤，
    而是决定芯片性能上限、且可以独立委外/自建的一道产业环节。
  怎么用它判断: |
    判断一家公司是不是真的做激光器芯片（C1），看它披露的工艺环节覆盖度：
    只说"设计+委外流片"的是设计公司；能自述外延到老化完整链条的才是 IDM。
    只做外延片、不做后段的，挂 M2a 不挂 C1。
  证据:
  - 谁: 仕佳光子
    原话: 针对DFB激光器芯片，公司已建立了包含外延生长、光栅制作、条形刻蚀、端面镀膜、划片裂片、特性测试、封装筛选和芯片老化的完整工艺线……成为国内少数掌握MQW有源区设计、MOCVD外延、电子束光栅、芯片加工、耦合封装的全产业链DFB激光器芯片生产企业
    出处: 2025年年度报告·主要业务
    锚型: local_file
    锚: corpus/annual/688313/688313/688313__em_仕佳光子_em__2025_2025年年度报告.pdf.txt#主要业务·有源产品段
  - 谁: 源杰科技
    原话: 掩埋型指……一种利用半导体外延层将发光层掩埋的结构，掩埋结构形成高效电注入，具备低功耗、电光转换效能高优势……脊波导型指……一种外观为长方脊型的结构，在脊型区中能形成电对光高密度转换，具备高效工艺生产优势，主要用于高速信号传输领域
