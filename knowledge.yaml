- id: KN008
  体系: 物理知识
  研究问题: [RQ000]
  格: []
  标题: 光模块最基本的工作——发送时电转光，接收时光转电
  一句话: |
    光收发模块夹在电子设备和光纤之间：发送时把电信号变成光信号，
    接收时再把光信号变回电信号。
  说细点: |
    服务器、交换机等电子设备内部处理的是电信号；光纤里传输的是光信号。
    具备发送和接收功能的光模块负责在这两种信号之间往返转换：发送端完成电转光，
    光信号经光纤传到远端后，接收端完成光转电。

    这是理解光模块的第一层，不等于完整零件清单，也没有规定它必须长成前面板可插拔盒子。
    单向发射器、单向接收器以及更具体的接口和封装形态，需要另行限定对象。
  怎么用它判断: |
    遇到“这是光模块吗”时，先问它是否承担电子系统与光传输介质之间的信号转换；
    再另行判断它是双向收发、单向器件、可插拔模块还是板载/共封装光学。
  证据:
    - 谁: 中际旭创股份有限公司
      原话: 光模块的作用就是光电转换，发送端把电信号转换成光信号，通过光纤传送后，接收端再把光信号转换成电信号。
      出处: 2024年年度报告·释义章节
