meta:
  version: v1
  用途: |
    知识库——回答"这个环节到底是干嘛的、为什么难、怎么判断谁够格"。
    与其他文件的分工：
      tree.yaml  = 产业由哪些环节构成（常识骨架，免锚）
      points.csv = 每个环节谁在做（须自家披露件引语+锚）
      knowledge.yaml = 为什么。每条须有证据引语+出处，没证据的常识不写这里。
  写法要求: |
    一句话/说细点 必须是不懂行的人能看懂的大白话：不用未解释的缩写，
    先说是什么、再说为什么难，数字要有对比对象。写完自问一句
    "我妈能看懂吗"，看不懂就重写。

knowledge:

- id: K001
  格: [EQ3]
  标题: 共晶固晶——把光芯片粘到板子上，粘歪几微米整个模块就废了
  一句话: |
    做光模块的第一步，是把激光器芯片用焊料"焊"在基板上。干这活的机器叫共晶固晶机。
    同名的机器，做显示屏的和做光模块的，精度差一个数量级——不是一档货。
  说细点: |
    光模块里有好几种芯片要贴：发光的激光器芯片、收光的探测器芯片、还有驱动和放大用的电芯片。
    它们要先被精确地固定在基板上，后面才能接线、对光、测试。

    为什么光模块这道工序特别难，有两个原因：
    一是激光器芯片本身发热厉害又怕热，焊接时温度控制不好就伤芯片；
    二是它贴的位置直接决定后面"光学耦合"能不能对上——光是走直线的，芯片偏几微米，
    光就射不进光纤了，整个模块报废。

    所以精度要求是这样的量级：光模块专用的共晶贴片设备，设备精度 ±1 微米、产品精度 ±3 微米。
    而做显示屏的贴合设备，指标是 ±0.05 毫米（也就是 ±50 微米）——差 15 倍以上。
  怎么用它判断: |
    一家公司说自己"造固晶机"，不等于它能造光模块用的那一档。判断看两条，有一条即可：
      ① 它说了客户是光模块/光芯片厂，或明说用于光通信；
      ② 它给出了微米级的精度指标（±1~3µm 这个量级）。
    两条都没有的，记"工序相邻但档次未证"，不入点——不是因为它没提"光"，
    而是因为没有任何证据表明它做的是这一档。
  证据:
  - 谁: 猎奇智能（专做光模块封测设备，科创板IPO在审）
    原话: 在光模块封测过程中，将激光器驱动芯片、跨阻放大器芯片、激光器芯片、探测器芯片等各类芯片通过特定的粘合剂（共晶焊料/导电胶/紫外胶）将各类芯片精确地固定在PCB上
    出处: 招股说明书（申报稿）·释义章节
    锚: 有锚；发行人自述（招股书）
  - 谁: 猎奇智能
    原话: 共晶贴片设备的设备精度达到±1µm，产品精度达到±3µm，技术水平与国际龙头齐平……公司设备已广泛应用于中际旭创、光迅科技、索尔思、源杰科技等光模块、光芯片龙头厂商
    出处: 招股说明书（申报稿）·核心竞争力
    锚: 有锚；发行人自述（招股书）
  - 谁: 猎奇智能
    原话: 光芯片能量密度较高，对温度高度敏感。从芯片测试，到芯片封装（共晶焊接）……
    出处: 招股说明书（申报稿）
    锚: 有锚；发行人自述（招股书）
  - 谁: 联得装备（反例：造固晶机但不是这一档）
    原话: 已完成高精度显示芯片倒装键合机、高速共晶固晶机、软焊料固晶机、AOI检测、引线框架贴膜和检测设备的研发，并形成销售订单
    出处: 2025年年度报告·管理层讨论与分析
    锚: 全年报11处微米级指标全部是显示类（绑定精度±4µm、贴合精度±0.05mm、边缘直线度±50µm），固晶机未给精度；应用对象自述为TFT-LCD/OLED/MiniLED/车载屏；全篇"光通信/光模块/光电子/硅光/激光器"零提及
  关联点: [P055]
  关联判例: 联得装备（triage 待判——工序对得上、档次未证）
  录入日期: '2026-07-26'

- id: K002
  格: [EQ8, D1, D2, D3, D4, D12]
  标题: 气密封装 vs 非气密——不是技术高低，是电信和数通两条路线的分野
  一句话: |
    把芯片用金属或陶瓷外壳密封起来、隔绝水汽，叫气密封装。
    电信设备要用它（要在户外扛十几年），数据中心不用（成本优先、机房环境可控）。
    所以"气密封装设备"这个环节只属于电信路线，数通路线根本不经过。
  说细点: |
    光芯片怕水汽。水汽进去，芯片会慢慢失效。解决办法是把芯片封在一个密闭腔体里，
    行业里叫"气密封装"，常见做法是金属外壳配平行缝焊，或者陶瓷管壳配同轴封装（就是常说的 TO-CAN）。

    但气密封装贵：要金属/陶瓷外壳，要专门的封焊设备，工序也多。

    数据中心的光模块选了另一条路——直接把裸芯片贴在电路板上、打线连接，不做密封，
    行业里叫 COB（板上芯片）。机房环境干净可控，模块换代又快，不需要为十几年寿命买单。

    所以同一个"封装"环节，两条路线走的是两套工艺、两套设备、两套材料：
      电信/接入路线 → 气密 → 金属外壳、陶瓷管壳、平行缝焊设备
      数通路线      → 非气密 → COB、氮化铝薄膜基板（低成本方案）

    这解释了产业结构图上一个现象：气密封装设备（EQ8）和 TOSA/ROSA/BOSA、陶瓷管壳
    这几个格子都挂在"电信气密"路线下，而数通路线的格子里是光引擎/COB组件。
    它们不是竞争关系，是两条路线各走各的。
  怎么用它判断: |
    看到"气密封装"四个字先分清三种角色，只有第三种才算 EQ8：
      ① 产品是气密封装的光模块 → 那是模块厂（MOD格）
      ② 卖气密封装用的外壳/基板 → 那是材料厂（D4/B2格）
      ③ 造封焊设备的 → 才是 EQ8
    今天扫到的 6 家候选全是①②，所以 EQ8 至今是空的。
  证据:
  - 谁: 东山精密
    原话: 400G QDD FR4 面向电信市场高可靠性400G产品的性能方案验证……Gen3.5 Hermetic……QDD气密封装光模块
    出处: 2025年年度报告·主要研发项目表
    锚: https://static.cninfo.com.cn/finalpage/2026-04-22/1225139318.PDF
    说明: 气密封装的研发项目，目的一栏直接写"面向电信市场高可靠性"——气密对应电信，原文自证
  - 谁: 中瓷电子
    原话: 全球新一轮AI技术爆发带动算力需求激增，直接拉动了数据中心建设和升级，从而对光模块产生了爆炸性需求。作为光模块封装关键材料，陶瓷外壳和基板市场需求快速增长，特别是氮化铝薄膜基板作为低成本非气密封装方案的关键封装材料呈现供不应求的情况
    出处: 2025年年度报告·行业情况
    锚: https://static.cninfo.com.cn/finalpage/2026-04-29/1225224991.PDF
    说明: AI数据中心需求拉动的是"低成本非气密封装方案"——数通对应非气密，原文自证
  - 谁: 联特科技
    原话: TO-CAN指同轴气密封装后的管芯；COB指chip on board缩写，板上芯片封装，一种光器件的封装工艺
    出处: 2025年年度报告·释义章节
    锚: https://static.cninfo.com.cn/finalpage/2026-04-29/1225239616.pdf
    说明: 两种封装方式的定义，来自模块厂自己的释义表
  关联点: []
  录入日期: '2026-07-26'

- id: K003
  格: []
  标题: 判定通用规则——造机器的、用机器的、卖材料的，是三家不同的公司
  一句话: |
    年报里出现某个工序的名字，不代表这家公司做这个工序，更不代表它造这个工序的设备。
    同一句话可能指三种完全不同的角色，挂错格子整张图就失真。
  说细点: |
    举今天遇到的真实例子：

    "通过储能焊和平行缝焊实现芯片密封" —— 说这话的燕东微，是**用**平行缝焊封自己的芯片，
    它是使用方。它不造缝焊机。所以它不能挂在"气密封装设备"这个格子上。

    "减压外延设备主要用于减压选择性外延工艺" —— 说这话的北方华创，是**造**外延设备的。
    它不做外延。所以它属于"外延设备"格，不属于"外延"格。

    "氮化铝薄膜基板作为低成本非气密封装方案的关键封装材料" —— 说这话的中瓷电子，
    是**卖材料**的。它既不封装也不造封装设备。

    三句话都提到了封装/外延，但三家公司在产业链上的位置完全不同。
  怎么用它判断: |
    读到一句证据，先问一句："这句话的主语，是在造它、用它，还是卖给做它的人？"
      造它 → 设备格（EQ*）
      做这道工序/产品 → 工序或器件格（M*/C*/D*/P*）
      卖原材料 → 材料格（M*/B*）
    判断不了的，宁可记待判，不要硬挂。
  证据:
  - 谁: 燕东微（使用方误判样本）
    原话: 该技术通过导电胶粘片、焊片烧接、摩擦焊实现芯片粘结……通过储能焊和平行缝焊实现芯片密封，采用该技术的产品具有密封性好，腔体内部气氛控制能力高等特点
    出处: 2025年年度报告·核心技术表
    锚: 本地扫描2025年报（688172）；本轮判为"驳回-非本格"
  - 谁: 北方华创（设备方误判样本）
    原话: 12英寸外延设备（EPI）……常压外延设备主要用于12英寸硅外延生长，减压外延设备主要用于减压选择性外延工艺
    出处: 2025年年度报告·主要产品表
    锚: https://static.cninfo.com.cn/finalpage/2026-04-18/1225122918.PDF ；本轮 M2c 判为"驳回-非本格"，其正确归属为 EQ1/EQ2
  关联判例: 历史判例 P067 长光华芯——"使用透镜≠生产透镜"，已撤销并改挂
  录入日期: '2026-07-26'

- id: K004
  格: [M2c]
  标题: 锗硅选区外延——硅光探测器的必经一步，但A股年报里找不到人做
  一句话: |
    硅本身"看不见"光通信用的红外光，得在硅片上按需要的位置长一层锗，才能做出探测器。
    这道工序在产业结构里必须有，但翻遍408份A股年报，没有一家公司说自己做这个。
  说细点: |
    硅光路线的想法是：把光路做在硅片上，用做芯片的成熟产线批量生产，便宜。
    但有个物理障碍——硅对 1310/1550 纳米的光是透明的，探测不到。

    解决办法是在硅片上需要的位置"选区"长一层锗（锗能吸收这些波长），做成锗探测器。
    "选区"的意思是只在指定位置长，不是整片长。

    问题是：这道工序目前查不到 A股公司自述在做。
    能查到的都是**造外延设备**的公司（中微、北方华创），那是另一个格子（见 K003）。
    真正做这道工序的，要么在境外代工厂，要么被包在国内代工厂"硅光工艺平台"这类笼统表述里，
    年报不写到这个粒度。
  怎么用它判断: |
    这一格目前是"有证据的空"——不是没找过，是找过没有。区别很重要：
      没找过 = 我们的问题
      找过没有 = 产业的现状（或者是我们语料/分母的边界）
    再有候选进来时，注意区分"造锗外延设备"和"做锗外延"，前者不算。
  证据:
  - 谁: 全库扫描
    原话: （无命中）
    出处: 408份A股年报全文检索
    锚: 关键词"选区外延"全库0命中；"锗硅外延"1家、"选择性外延"2家，全部为设备商或MicroLED异材料体系
  - 谁: kimi 聚源公告库检索
    原话: （无命中）
    出处: 约21轮自然语言全文检索，覆盖年报/半年报/招股书/募集说明书/问询回复
    锚: 关键词"选区外延"在A股披露文件正文0命中；器件厂披露中该工序被包进"硅光/硅基光子集成/工艺开发及晶圆制造"笼统表述
  - 谁: 中微公司（设备侧，非本格）
    原话: 公司硅和锗硅外延EPI设备已顺利运付客户端进行量产验证，并且获得客户高度认可
    出处: 2025年年度报告
    锚: https://static.cninfo.com.cn/finalpage/2026-03-31/1225062431.PDF ；已按设备能力入 P115@EQ1
  关联点: []
  录入日期: '2026-07-26'
