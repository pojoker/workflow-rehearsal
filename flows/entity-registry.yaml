# ====================== 第二层：观察 scope 层 ======================
observation_scope_layer:
  default_policy: >
    未显式声明 scope 的边，默认按 legal_entity 口径观察；
    仅当披露原文明示合并（集团/分支）口径时才登记 group / branch scope。
  scopes:

    # 裁决 1：联讯以集团合并口径披露
    - scope_id: SC_HISENSE_GROUP_LIANXUN
      scope_level: group
      based_on_entity: GROUP_HISENSE
      members: [LEGAL_HISENSE_BROADBAND]
      scope_effective_period: {start: "", end: ""}
      disclosure_basis: "联讯招股书 E087/E089/E092"
      anchor: ""                 # registry 未载 URL，待补
      source_ruling: 1
      notes: "联讯披露口径为集团合并；与源杰法人口径不同，故分两条 scope 观察"

    - scope_id: SC_HISENSE_BROADBAND_LEGAL
      scope_level: legal_entity
      based_on_entity: LEGAL_HISENSE_BROADBAND
      members: [LEGAL_HISENSE_BROADBAND]
      scope_effective_period: {start: "", end: ""}
      disclosure_basis: "源杰客户（具体法人）"
      anchor: ""
      source_ruling: 1
      notes: "源杰以具体法人'海信宽带'披露"

    # 裁决 2：仅原文明示合并的前五大用 group scope
    - scope_id: SC_INNOLIGHT_GROUP_PROSPECTUS
      scope_level: group
      based_on_entity: GROUP_INNOLIGHT
      members: [LEGAL_SUZHOU_INNOLIGHT, LEGAL_CHENGDU_INNOLIGHT, LEGAL_CHUHAN]
      scope_effective_period: {start: "", end: ""}
      disclosure_basis: "源杰招股书前五大（明文并表列示）"
      anchor: ""
      source_ruling: 2
      notes: "仅原文明示合并的前五大观察使用 group scope；其余按法人分列"

    # 裁决 3：长飞合并行口径
    - scope_id: SC_YOFC_MERGED
      scope_level: group
      based_on_entity: GROUP_YOFC
      members: [LEGAL_YOFC_CONSOLIDATED, LEGAL_YOFC_OVERSEAS, LEGAL_YOFC_HANCHUAN]
      scope_effective_period: {start: "", end: ""}
      disclosure_basis: "博创年报关联方表合并行"
      anchor: ""
      source_ruling: 3
      notes: "'长飞光纤合并'观察保留成员与期间；各法人仍可独立 legal_entity scope"

    # 裁决 4：更名前/后观察口径
    - scope_id: SC_YUSHENG_RENAME
      scope_level: legal_entity
      based_on_entity: LEGAL_WUHAN_YUSHENG_OPTICAL
      members: [LEGAL_WUHAN_YUSHENG_DEVICES, LEGAL_WUHAN_YUSHENG_OPTICAL]
      scope_effective_period: {start: "", end: ""}
      disclosure_basis: "源杰 IPO / 仕佳 / 博创 披露"
      anchor: ""
      source_ruling: 4
      notes: >
        更名证据确认前，pre-rename 观察用 LEGAL_WUHAN_YUSHENG_DEVICES，
        post-rename 用 LEGAL_WUHAN_YUSHENG_OPTICAL；二者仅 possible_same_as，不硬合并

    # 裁决 5：顺丰集团口径合并
    - scope_id: SC_SF_MERGED
      scope_level: legal_entity
      based_on_entity: LEGAL_SF_EXPRESS
      members: [LEGAL_SF_EXPRESS, LEGAL_XIAN_SF]
      scope_effective_period: {start: "", end: ""}
      disclosure_basis: "源杰两处披露"
      anchor: ""
      source_ruling: 5
      notes: "物流服务商，集团口径合理；西安顺丰为子/分支，可走 branch scope 独立观察"
