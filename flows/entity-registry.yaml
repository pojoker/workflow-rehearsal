# flows/entity-registry.yaml — 节点实体归并登记册·机器可读两层契约 (v1.7-E 项)
# =====================================================================
# 数据化来源：flows/entity-registry.md（5 条归并裁决骨架）
# 设计依据：
#   - ROADMAP-v1.7a.md §E（两层契约：身份层 + 观察 scope 层）
#   - flows/out/roadmap-v17-review-codex.md §E（三表合并为两层的裁决）
# 冻结基线：236 边 / 169 节点 (commit 6b6d491)
#
# 两层：
#   1) identity_layer  —— 回答“这些名称是不是同一法人 / 是否属同一集团 / 何时生效”
#      字段：entity_id, identity_type(legal_entity|group), canonical_name, legal_name,
#            identifiers(代码/证券/信源代码), aliases[{name, effective_from, effective_to}],
#            rename_evidence{status, anchor, retrieved},
#            related{member_of, parent_of, possible_same_as, predecessor_of},
#            identity_decision, registry_ruling, registry_status, source_ruling, notes
#   2) observation_scope_layer —— 回答“这一条披露数字究竟是集团/法人/分支口径”
#      字段：scope_id, scope_level(group|legal_entity|branch), based_on_entity,
#            members[entity_id], scope_effective_period{start, end},
#            disclosure_basis, anchor, source_ruling, notes
#
# 约定：
#   - identity_decision ∈ {same_legal_entity, distinct_legal_entities, pending}
#     （对应 codex 两裁决：同一法人 / 不同法人 / 待证；取代原 v1.6 三选一“合并/分列/照录”）
#   - registry_ruling / registry_status 原样保留 entity-registry.md 的治理状态
#   - rename_evidence.status ∈ {confirmed, pending, none}
#   - 未补锚点的字段留空字符串 ""，不伪造 URL（诚实边界）

schema_version: 1
source_doc: flows/entity-registry.md
frozen_baseline: "236边/169节点 commit 6b6d491"
basis:
  - ROADMAP-v1.7a.md#E
  - flows/out/roadmap-v17-review-codex.md#E

