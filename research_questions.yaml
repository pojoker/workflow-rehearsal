meta:
  version: v3
  root_id: RQ000
  answer_target: knowledge.yaml
  # ---- 完成语义（契约，改动须人工评审，不得由脚本自动翻转）----
  # 旧字段名 `acceptance` 已重命名为 `minimum_writeback_contract`：它描述的是"有材料可回填"的
  # 机器最低条件，不是"问题已完成"。旧名会诱导把"有一条 KN/WHY 引用"读成"问题已回答"，故弃用。
  completion_semantics:
    linked_kn_or_why_means: 已有材料
    linked_kn_or_why_does_not_mean: 已完成
    completion_is: 由人工复核判定（并需用户确认写入 canonical），本文件不保存自动完成状态
    machine_role: 只判结构与引用闭合（scan.py 不变量⑭ + render.py 渲染），不判语义蕴含
    forbidden_phrasing_when_describing_question_state: [已覆盖, 已完成, 已回答]
    required_phrasing_when_describing_question_state: [已有材料]

# 人工策划问题图：parent_id 只决定页面树形展示，depends_on 保存真实理解依赖；不保存事实答案或自动状态。
# 答案进入 knowledge.yaml（物理知识/技术路线 KN）；跨体系因果关系进入 why_links。
# 问题 ID 与文案首版冻结（上游方案 §5）；新增问题须改本文件并升版本。
# 每题 `minimum_writeback_contract` 只规定"有材料可回填"的最低条件；问题是否完成由人工复核判定。
