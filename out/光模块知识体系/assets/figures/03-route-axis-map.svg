<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">光模块技术路线六轴地图</title>
  <desc id="desc">链路、光链组织、电处理、光子实现、物理位置和产品外形是不同选择轴，只有逐轴选择并组合后才能形成完整路线。</desc>
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#087d78"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#18242d}.title{font-size:28px;font-weight:700;fill:#fff}.sub{font-size:14px;fill:#cfe4e3}.axis{font-size:15px;font-weight:700;fill:#102f3b}.q{font-size:11px;fill:#63727d}.tag{font-size:12px;font-weight:700}.why{font-size:12px;font-weight:700;fill:#8a5511}</style></defs>
  <rect width="1200" height="720" rx="26" fill="#f6f8f5"/><rect width="1200" height="104" rx="26" fill="#102f3b"/><rect y="78" width="1200" height="26" fill="#102f3b"/>
  <text x="48" y="47" class="title">技术名词先归轴，再组合成路线</text><text x="48" y="77" class="sub">EML、SiPh、LPO、CPO 不是同一层级的互斥选项；每个名词只回答一类问题。</text>
  <g transform="translate(48 130)">
    <g><rect width="1104" height="72" rx="15" fill="#fff" stroke="#dce2da"/><text x="20" y="30" class="axis">1 链路需求</text><text x="20" y="51" class="q">要传多快、多远？</text><g transform="translate(250 17)"><rect width="112" height="38" rx="19" fill="#e5f1ed"/><text x="56" y="24" text-anchor="middle" class="tag">800G / 1.6T</text><rect x="126" width="112" height="38" rx="19" fill="#e5f1ed"/><text x="182" y="24" text-anchor="middle" class="tag">500m / 2km</text><rect x="252" width="112" height="38" rx="19" fill="#e5f1ed"/><text x="308" y="24" text-anchor="middle" class="tag">SMF / MMF</text></g></g>
    <g transform="translate(0 84)"><rect width="1104" height="72" rx="15" fill="#fff" stroke="#dce2da"/><text x="20" y="30" class="axis">2 光链组织</text><text x="20" y="51" class="q">lane 靠空间还是波长区分？</text><g transform="translate(250 17)"><rect width="112" height="38" rx="19" fill="#edf2fb"/><text x="56" y="24" text-anchor="middle" class="tag">Parallel</text><rect x="126" width="112" height="38" rx="19" fill="#edf2fb"/><text x="182" y="24" text-anchor="middle" class="tag">WDM</text><rect x="252" width="150" height="38" rx="19" fill="#edf2fb"/><text x="327" y="24" text-anchor="middle" class="tag">DR4 / DR8 / FR4</text></g></g>
    <g transform="translate(0 168)"><rect width="1104" height="72" rx="15" fill="#fff" stroke="#dce2da"/><text x="20" y="30" class="axis">3 电处理职责</text><text x="20" y="51" class="q">信号恢复留在模块还是更多交给 Host？</text><g transform="translate(250 17)"><rect width="112" height="38" rx="19" fill="#fff0d7"/><text x="56" y="24" text-anchor="middle" class="tag">Retimed</text><rect x="126" width="112" height="38" rx="19" fill="#fff0d7"/><text x="182" y="24" text-anchor="middle" class="tag">LPO</text><rect x="252" width="112" height="38" rx="19" fill="#fff0d7"/><text x="308" y="24" text-anchor="middle" class="tag">LRO</text></g></g>
    <g transform="translate(0 252)"><rect width="1104" height="72" rx="15" fill="#fff" stroke="#dce2da"/><text x="20" y="30" class="axis">4 光子实现</text><text x="20" y="51" class="q">怎样产生光、调制、复用和探测？</text><g transform="translate(250 17)"><rect width="112" height="38" rx="19" fill="#f8e2df"/><text x="56" y="24" text-anchor="middle" class="tag">EML</text><rect x="126" width="112" height="38" rx="19" fill="#f8e2df"/><text x="182" y="24" text-anchor="middle" class="tag">SiPh</text><rect x="252" width="112" height="38" rx="19" fill="#f8e2df"/><text x="308" y="24" text-anchor="middle" class="tag">DML</text><text x="430" y="25" class="why">器件组合与集成平台粒度不同</text></g></g>
    <g transform="translate(0 336)"><rect width="1104" height="72" rx="15" fill="#fff" stroke="#dce2da"/><text x="20" y="30" class="axis">5 物理位置</text><text x="20" y="51" class="q">光学放在前面板、ASIC 附近还是共同封装？</text><g transform="translate(250 17)"><rect width="112" height="38" rx="19" fill="#e5f1ed"/><text x="56" y="24" text-anchor="middle" class="tag">Pluggable</text><rect x="126" width="112" height="38" rx="19" fill="#e5f1ed"/><text x="182" y="24" text-anchor="middle" class="tag">NPO</text><rect x="252" width="112" height="38" rx="19" fill="#e5f1ed"/><text x="308" y="24" text-anchor="middle" class="tag">CPO</text></g></g>
    <g transform="translate(0 420)"><rect width="1104" height="72" rx="15" fill="#fff" stroke="#dce2da"/><text x="20" y="30" class="axis">6 产品外形</text><text x="20" y="51" class="q">机械、供电、散热与接口采用什么形态？</text><g transform="translate(250 17)"><rect width="112" height="38" rx="19" fill="#edf2fb"/><text x="56" y="24" text-anchor="middle" class="tag">OSFP</text><rect x="126" width="112" height="38" rx="19" fill="#edf2fb"/><text x="182" y="24" text-anchor="middle" class="tag">QSFP-DD</text><rect x="252" width="150" height="38" rx="19" fill="#edf2fb"/><text x="327" y="24" text-anchor="middle" class="tag">Engine / package</text></g></g>
  </g>
  <line x1="600" y1="628" x2="600" y2="663" stroke="#087d78" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="310" y="666" width="580" height="38" rx="19" fill="#102f3b"/><text x="600" y="691" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;font-weight:700;fill:#fff">六轴组合 + 对象证据 + 成熟度 = 一条可审查的 Route Profile</text>
</svg>
