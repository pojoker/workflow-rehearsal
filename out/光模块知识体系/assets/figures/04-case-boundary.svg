<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">硅光激光器数量的案例边界</title>
  <desc id="desc">通用硅光没有固定激光器数量，目标 800G DR8 LPO SiPh 产品仍未知；Intel CWDM4 的四个激光器和 NVIDIA Q3450-LD 的 144 个系统级激光器只能作为对象案例。</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#18242d}.h{font-size:28px;font-weight:700;fill:#fff}.sub{font-size:14px;fill:#cfe4e3}.label{font-size:15px;font-weight:700}.note{font-size:12px;fill:#63727d}.big{font-size:22px;font-weight:700;fill:#102f3b}.warn{font-size:11px;font-weight:700;fill:#8c433d}</style></defs>
  <rect width="1200" height="600" rx="26" fill="#f6f8f5"/><rect width="1200" height="104" rx="26" fill="#102f3b"/><rect y="78" width="1200" height="26" fill="#102f3b"/>
  <text x="48" y="47" class="h">案例可以解释 UNKNOWN，但不能替代 UNKNOWN</text><text x="48" y="77" class="sub">正确动作是缩小主张范围：通用结论、目标对象和现实案例分层展示。</text>
  <g transform="translate(48 132)"><rect width="1104" height="92" rx="18" fill="#fff" stroke="#dce2da"/><text x="22" y="32" class="label">通用 SiPh 平台</text><text x="260" y="44" class="big">激光器数量没有固定答案</text><text x="260" y="69" class="note">取决于 lane、波长组织、共享方式、光源位置和冗余设计。</text><circle cx="1044" cy="46" r="25" fill="#edf0ed"/><text x="1044" y="53" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#63727d">?</text></g>
  <g transform="translate(48 240)"><rect width="1104" height="92" rx="18" fill="#fff8f7" stroke="#e2b5af"/><text x="22" y="32" class="label">当前目标：800G DR8 LPO SiPh</text><text x="420" y="44" class="big" style="fill:#8c433d">UNKNOWN</text><text x="420" y="69" class="note">产品页未公开 laser 数量、位置、类型或供应商。</text><text x="875" y="50" class="warn">不能从其他产品继承</text></g>
  <g transform="translate(48 354)"><rect width="532" height="164" rx="18" fill="#fff" stroke="#9bb1df"/><text x="22" y="32" class="label">对象案例 A · Intel CWDM4</text><text x="22" y="56" class="note">四个不同波长 laser + 四个 modulator + 片上 mux</text><g transform="translate(22 76)"><circle cx="24" cy="24" r="22" fill="#ffd66f"/><circle cx="82" cy="24" r="22" fill="#ffd66f"/><circle cx="140" cy="24" r="22" fill="#ffd66f"/><circle cx="198" cy="24" r="22" fill="#ffd66f"/><text x="24" y="30" text-anchor="middle" class="label">λ1</text><text x="82" y="30" text-anchor="middle" class="label">λ2</text><text x="140" y="30" text-anchor="middle" class="label">λ3</text><text x="198" y="30" text-anchor="middle" class="label">λ4</text><text x="248" y="29" class="big">4</text></g><text x="22" y="145" class="warn">较早 CWDM4 实现，不是目标产品 BOM</text></g>
  <g transform="translate(620 354)"><rect width="532" height="164" rx="18" fill="#fff" stroke="#9bb1df"/><text x="22" y="32" class="label">对象案例 B · NVIDIA Q3450-LD</text><text x="22" y="56" class="note">18 个外置 ELS × 每个 8 个 laser</text><g transform="translate(22 76)"><circle cx="22" cy="22" r="20" fill="#ffd66f"/><circle cx="72" cy="22" r="20" fill="#ffd66f"/><circle cx="122" cy="22" r="20" fill="#ffd66f"/><circle cx="172" cy="22" r="20" fill="#ffd66f"/><text x="22" y="27" text-anchor="middle" class="label">1</text><text x="72" y="27" text-anchor="middle" class="label">2</text><text x="122" y="27" text-anchor="middle" class="label">…</text><text x="172" y="27" text-anchor="middle" class="label">8</text><text x="220" y="29" class="big">× 18 = 144</text></g><text x="22" y="145" class="warn">整台 CPO 系统数字，不是单个硅光模块数字</text></g>
  <rect x="48" y="540" width="1104" height="38" rx="12" fill="#eef2fb"/><text x="600" y="565" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:12px;font-weight:700;fill:#36547d">案例展示“实现空间”；只有目标对象直接证据才能关闭目标字段。</text>
</svg>
