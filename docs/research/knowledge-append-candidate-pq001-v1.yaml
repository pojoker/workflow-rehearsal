    entailment_contract:
      atomic_claim: 前面板机笼与金手指不是所有光模块的必要边界_OSFP以金手指外壳连接主机连接器和机笼_而OIF_3.2T_CPO模块可近ASIC共基板或嵌板并以尾纤连接光侧
      claim_class: stable_explanation
      applies_when: 比较前面板可插拔OSFP与OIF_3.2T_CPO_IA所定义模块的机械边界
      does_not_apply_when: 推断所有CPO都无机笼或金手指_把ASIC或基板算入模块_推断具体产品内部BOM
      proposed_disposition: ready_for_stable_explanation_review
      evidence:
        - source_id: S4-OSFP-Rev5.22
          source_type: msa_specification_web_snapshot
          locator: corpus/web/2026-08-23/osfpmsa.org__OSFP_Module_Specification_Rev5_22.pdf#印刷页17_30_159-160·§1_§3.5_§15
          supports: OSFP模块金手指与主机连接器配合_模块外壳与主机机笼配合_模块边缘连接器承载高速与低速信号和供电
          does_not_support: 所有光模块均采用OSFP形态_OSFP规范给出完整内部BOM
        - source_id: S5-OIF-3.2T-CPO-01.0
          source_type: implementation_agreement_web_snapshot
          locator: corpus/web/2026-08-23/oiforum.com__OIF-Co-Packaging-3.2T-Module-01.0.pdf#印刷页7_9-10_24·§1_架构图_§6
          supports: 该IA中的光模块近ASIC_可同处共封装基板或嵌板_光侧为尾纤且最终连接器位置未固定
          does_not_support: 所有CPO的唯一实现_ASIC或基板属于光模块_所有光模块均使用尾纤
      falsifier: OSFP来源不再要求所述主机配合关系_且该OIF_CPO_IA也要求相同的前面板机笼与金手指作为模块必要边界
    append_payload:
      id: KN010
      体系: 物理知识
      研究问题: [PQ001]
      格: []
      标题: 外壳不是定义——可插拔 OSFP 和 CPO 有不同机械边界
      一句话: |
        OSFP 模块通过金手指和外壳接入主机连接器与机笼；OIF 的一种 3.2T CPO 模块则靠近交换芯片，
        可共基板或嵌在板上并用尾纤接出，所以前面板机笼不是所有光模块的必要条件。
      说细点: |
        在 OSFP 这种前面板可插拔形态中，模块电路板的金手指与主机连接器配合，模块外壳与主机机笼配合。
        这是一个清楚、可替换的机械边界，但它只描述 OSFP/OSFP-RHS 家族。

        OIF 的 3.2T 共封装模块规范给出了另一种实例：光模块靠近交换芯片，可与芯片同处一个共封装基板
        但仍是不同对象，也可以嵌在系统板上；光侧以尾纤引出，最终光连接器的位置和实现没有被该规范固定。

        因而判定“是不是光模块”时，不能先把前面板盒子、机笼或金手指当成必要条件。
        这也不等于所有 CPO 都采用同一种结构，更不能把交换芯片或整块基板算进光模块本体。
      怎么用它判断: |
        先按具体规范或产品资料画出模块与主机、介质的接口，再标机械边界；
        不要把某一种可插拔形态的机笼、金手指和散热结构拼成所有光模块的共同零件表。
      证据:
        - 谁: OSFP MSA
          原话: （忠实转述，非逐字引文）规范分别定义模块机械形态、主机机笼及配套连接器和主机 PCB 布局；模块 PCB 的接触垫与 §5.10 规定的连接器配合。
          出处: OSFP Module Specification Rev 5.22·§1、§3.5、§15
          锚型: web_snapshot
          锚:
            原URL: https://www.osfpmsa.org/assets/pdf/OSFP_Module_Specification_Rev5_22.pdf
            存档路径: corpus/web/2026-08-23/osfpmsa.org__OSFP_Module_Specification_Rev5_22.pdf
            抓取日期: '2026-08-23'
            SHA256: c8e80dda50e85b1d4ec96c88642d8a9ed0ed254124f9442f20c51559533850eb
          说明: 仅用于OSFP/OSFP-RHS实例_不推广为全部光模块
        - 谁: Optical Internetworking Forum（OIF）
          原话: （忠实转述，非逐字引文）光模块为交换芯片把短距电接口转换为光输入输出；模块可沿基板周边布置或嵌在板上，并以尾纤引出；该协议未固定光连接器实现。
          出处: OIF-Co-Packaging-3.2T-Module-01.0·§1、架构图、§6
          锚型: web_snapshot
          锚:
            原URL: https://www.oiforum.com/wp-content/uploads/OIF-Co-Packaging-3.2T-Module-01.0.pdf
            存档路径: corpus/web/2026-08-23/oiforum.com__OIF-Co-Packaging-3.2T-Module-01.0.pdf
            抓取日期: '2026-08-23'
            SHA256: 586d0ed09f2e19d49bf92b23bb681c266d63db6c477d9c8e8c6cd6cf1d6a304f
          说明: 仅用于该3.2T_CPO_IA实例_不推广为所有CPO
      录入日期: '2026-08-31'

