    entailment_contract:
      atomic_claim: 在CMIS管理的传输模块中_主机接口是模块与主机之间的高速电接口_介质接口是模块与远端介质之间的高速电或光接口_应用功能在两侧之间桥接
      claim_class: stable_explanation
      applies_when: 解释CMIS管理的传输模块的任务接口骨架
      does_not_apply_when: 非CMIS对象_CMIS资源模块或线缆组件例外_具体外壳连接器散热器与内部BOM
      proposed_disposition: ready_for_stable_explanation_review
      evidence:
        - source_id: S3-OIF-CMIS-05.4
          source_type: implementation_agreement_web_snapshot
          locator: corpus/web/2026-08-23/oiforum.com__OIF-CMIS-05.4.pdf#印刷页65-67·§6至§6.2.1.1
          supports: Host_Interface与Media_Interface定义_Application桥接功能_高速任务接口与低速管理通信分层
          does_not_support: 所有光模块都受CMIS管理_media必为光_具体机械边界或完整BOM
      falsifier: 适用版本的CMIS正文不再以Host_Interface和Media_Interface描述传输模块任务接口_或目标对象不在CMIS适用范围内
    append_payload:
      id: KN009
      体系: 物理知识
      研究问题: [PQ001]
      格: []
      标题: 先看两侧接口——模块把主机侧高速电信号接到远端介质
      一句话: |
        对采用 CMIS 管理的传输模块，主机一侧是高速电接口，远端一侧是高速电或光接口，
        模块的应用功能负责把两侧接起来。
      说细点: |
        CMIS 把与传输任务直接相关的物理接口分成两侧：Host Interface 位于模块和主机系统之间，
        是高速电接口；Media Interface 位于模块和远端介质之间，可以是高速电接口，也可以是光接口。
        模块中的 Application 是连接主机侧和介质侧的桥接或转发功能。

        这里说的是 CMIS 管理的 transmission module，不是所有光模块的统一定义。
        CMIS 还使用低速双线通信来做主机到模块的管理，但它和承载业务数据的高速接口不是一回事。
        这套接口骨架也没有直接规定外壳、机笼、连接器、散热器或内部零件清单。
      怎么用它判断: |
        研究一个模块时先把“高速业务接口”和“低速管理接口”分开，再分别标出主机侧与介质侧；
        只有确认对象受 CMIS 管理时，才可直接套用这里的术语。
      证据:
        - 谁: Optical Internetworking Forum（OIF）
          原话: （忠实转述，非逐字引文）Host Interface 是模块与主机系统之间的高速电接口；Media Interface 是模块与连接远端节点的介质之间的高速电或光接口；Application 描述主机侧与介质侧接口电路之间的桥接或转发功能。
          出处: OIF-CMIS-05.4·§6.1.1、§6.1.2、§6.2.1.1
          锚型: web_snapshot
          锚:
            原URL: https://www.oiforum.com/wp-content/uploads/OIF-CMIS-05.4.pdf
            存档路径: corpus/web/2026-08-23/oiforum.com__OIF-CMIS-05.4.pdf
            抓取日期: '2026-08-23'
            SHA256: cd57ebb1cfb8e0a9e9c7b63862b5b261855e9b77844f4cf85bd36ea3808911db
          说明: 仅用于CMIS管理的传输模块_不扩张到全部光模块
      录入日期: '2026-08-31'

  - candidate_id: PQ001-KN-C03
    proposed_knowledge_id: KN010
    target_contract:
