coverage_rules:
  - every_portfolio_question_must_appear_exactly_once
  - every_mapping_must_resolve_to_its_source_question
  - every_mapping_must_have_at_least_one_coordinate
  - empty_cells_are_valid_results_and_must_not_be_filled_to_satisfy_a_quota
  - a_blind_spot_does_not_automatically_create_a_question
  - stable_foundation_cells_may_intentionally_have_no_expert_question
  - blocked_questions_must_not_be_repackaged_as_public_search_questions

