blind_spots:
  - blind_spot_id: BS-STABLE-SYSTEM-FUNCTION
    coordinate: physical.system_function
    classification: intentional_empty
    reason: basic_TX_RX_function_is_stable_foundation_not_an_expert_research_frontier
    action: do_not_generate_question

  - blind_spot_id: BS-PHOTONIC-IMPLEMENTATION-COMPARISON
    coordinate: route.photonic_implementation_x_physical.component_architecture
    classification: undercovered_by_current_30
    reason: current_questions_cover_mux_and_external_laser_but_not_exact_object_EML_vs_SiPh_function_allocation
    existing_unadmitted_questions: [Q-MID-03, Q-DOWN-01]
    action: reuse_and_upgrade_existing_questions_before_creating_new_id

  - blind_spot_id: BS-SYSTEM-DEMAND-TO-ROUTE
    coordinate: why.upstream_constraint_x_route.placement_and_packaging
    classification: genuine_gap
    reason: current_placement_questions_start_at_electrical_thermal_or_service_constraints_not_at_named_system_topology_and_port_budget
    action: prepare_one_candidate_question_without_portfolio_admission
    candidate_artifact: docs/research/expert-question-coverage-gap-candidate-v1.yaml
    candidate_state: externally_reviewed_waiting_separate_user_admission_decision

  - blind_spot_id: BS-PRODUCT-FORM-FACTOR
    coordinate: route.product_form_factor
    classification: undercovered_but_not_yet_actionable
    reason: Q_UP_02_covers_common_front_panel_constraints_but_no_same_system_OSFP_QSFP_DD_choice_object_is_bound
    action: wait_for_exact_comparison_object_and_do_not_generate_generic_question

  - blind_spot_id: BS-MAINSTREAM-DENOMINATOR
    coordinate: why.company_or_market_consequence_x_route.maturity_and_company_role
    classification: known_blocked_outside_30
    reason: route_share_requires_a_common_denominator_source
    existing_unadmitted_questions: [Q-DOWN-04, Q-DOWN-05]
    action: do_not_duplicate_until_denominator_source_exists

