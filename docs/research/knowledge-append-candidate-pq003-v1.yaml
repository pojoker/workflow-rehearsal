    append_payload:
      id: KN014
      体系: 物理知识
      研究问题: [PQ003]
      格: []
      标题: 本项目的教学参考样机——FTCE4517E1PxM 只代表一个受限产品族
      一句话: |
        后续拆组件和接口时，以 Coherent/Finisar FTCE4517E1PxM 800G-DR8 OSFP 产品族为教学样机。
        它的价值是公开字段在同一产品上下文中较完整，不代表它是市场最主流或所有光模块的统一结构。
      说细点: |
        冻结规格书把这个产品族描述为 hot-pluggable OSFP transceiver，支持 850 Gb/s aggregate bit rate、
        8×100G retimed PAM4 electrical interface、parallel MPO-16、I2C management 和最长 500 m G.652 SMF；
        冻结产品页另把 transmitter 标为 EML、receiver 标为 PIN。

        这些字段让我们可以在同一真实对象上继续追问：主机电接口怎样进入模块、光接口怎样接到介质、
        管理和供电怎样分层，以及已披露器件标签与未知内部实现之间的边界。

        产品族模式仍含温度占位后缀（x = C/L），所以这里不虚构 exact orderable SKU。规格书也没有披露
        独立 DSP、driver、TIA、lens、FAU、TEC、完整内部连线、商业成熟度或客户采用。教学参考角色只是一项
        可撤销的研究基线，不能被写成“行业最主流”或“所有光模块都这样”。
      怎么用它判断: |
        研究后续组件或接口时，先确认事实是否来自同一 FTCE4517E1PxM 产品上下文；只有已披露字段可以继承。
        遇到完整 BOM、器件数量/位置、量产或市场份额时保持 UNKNOWN。若研究对象改为 coherent、NPO、CPO
        或其他速率/reach，应重新选样机，而不是强行沿用本卡。
      证据:
