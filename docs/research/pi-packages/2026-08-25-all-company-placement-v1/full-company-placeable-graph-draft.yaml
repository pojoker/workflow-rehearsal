edge_contract:
- edge_type: POINT_DECLARED_CELL
  count: 271
  meaning: source row's existing cell, not a newly inferred capability
- edge_type: POINT_ELIGIBLE_ATTACHMENT
  count: 269
  meaning: eligible for facet/role review; not canonical promotion
- edge_type: POINT_BLOCKED_ATTACHMENT
  count: 2
  meaning: kept in review queue, not attached as company capability
- edge_type: POINT_PROPOSES_FACET
  count: 484
  meaning: span-backed draft facet assertion
- edge_type: POINT_PROPOSES_ROLE
  count: 272
  meaning: span-backed draft role assertion
- edge_type: ASSERTION_CANDIDATE_MATCHES_REQUIREMENT
  count: 6
  meaning: generic-scope or single-attribute candidate; not route service
- edge_type: ASSERTION_RELATED_FACET_ONLY
  count: 16
  meaning: does not create a requirement match
- edge_type: COMPANY_SERVES_ROUTE
  count: 0
  meaning: requires separate Route Service Evidence
- edge_type: CONSTRAINT_EXPLAINS_REQUIREMENT
  count: 0
  meaning: requires controlled tradeoff evidence
