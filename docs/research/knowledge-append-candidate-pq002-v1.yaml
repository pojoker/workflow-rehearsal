      applies_when: 解释CMIS管理的传输模块的收发方向_并以光纤型光收发模块说明电光转换
      does_not_apply_when: 非CMIS对象_CMIS允许的电介质实例_内部器件顺序_完整BOM或具体机械形态
      proposed_disposition: ready_for_stable_explanation_review
      evidence:
        - source_id: S1-OIF-CMIS-05.4
          source_type: implementation_agreement_web_snapshot
          locator: corpus/web/2026-08-23/oiforum.com__OIF-CMIS-05.4.pdf#印刷页65-67·§6.1.1至§6.2.1.1
          supports: Host侧发送输入与接收输出方向_Media侧发送输出与接收输入方向_Application在两侧之间桥接
          does_not_support: Media一定是光纤_远端模块内部行为_任何内部器件顺序
        - source_id: S2-中际旭创2024年报
          source_type: annual_report_local_file
          locator: corpus/annual-2024/300308/300308__em_中际旭创_em__2024_2024年年度报告.pdf.txt#释义章节·光模块/光通信模块
          supports: 光纤型光模块发送端电转光_经光纤后接收端光转电
          does_not_support: CMIS接口名称_完整BOM_所有介质均为光纤
      falsifier: 目标对象不在CMIS传输模块适用范围_或适用版本不再采用所述Host与Media收发方向_或目标介质并非光而仍被写成电光转换
    append_payload:
      id: KN011
      体系: 物理知识
      研究问题: [PQ002]
      格: []
      标题: 一条信号怎样穿过光模块——发出去走一遍，收回来反向走一遍
      一句话: |
        发送时，主机把高速电信号送进模块，模块再把信号送到传输介质；接收时方向相反。
        对以光纤为介质的光收发模块，这两段分别包含电转光和光转电。
      说细点: |
        在采用 CMIS 管理的传输模块里，主机送进模块的高速信号叫发送输入，模块送回主机的
        高速信号叫接收输出；介质一侧，模块送向介质的是发送输出，介质送进模块的是接收输入。
        模块中的应用功能负责在主机侧和介质侧之间桥接。

        CMIS 允许介质侧是高速电接口或光接口，所以不能只凭 CMIS 就说介质一定是光纤。
        当研究对象明确是光纤型光收发模块时，公司年报给出的功能口径补上了中间的物理转换：
        发送端把电信号变成光信号，经光纤传输后，接收端再把光信号变回电信号。

        这仍是一条功能链，不是内部零件连线图。它没有回答 DSP、驱动器、激光器、探测器和
        放大器究竟如何集成或排序。
      怎么用它判断: |
        先逐段标出“谁把什么信号送给谁”：主机发送输入、介质发送输出、介质接收输入、主机接收输出。
        再确认介质究竟是光还是电；只有介质为光时，才把中间写成电转光和光转电。
      证据:
        - 谁: Optical Internetworking Forum（OIF）
          原话: （忠实转述，非逐字引文）Host Interface 上，主机到模块是 transmitter input、模块到主机是 receiver output；Media Interface 上，模块到介质是 transmitter output、介质到模块是 receiver input；Application 在两侧之间桥接或转发。
          出处: OIF-CMIS-05.4·§6.1.1、§6.1.2、§6.2.1.1
          锚型: web_snapshot
          锚:
            原URL: https://www.oiforum.com/wp-content/uploads/OIF-CMIS-05.4.pdf
            存档路径: corpus/web/2026-08-23/oiforum.com__OIF-CMIS-05.4.pdf
            抓取日期: '2026-08-23'
            SHA256: cd57ebb1cfb8e0a9e9c7b63862b5b261855e9b77844f4cf85bd36ea3808911db
          说明: 只支撑CMIS条件骨架_不单独证明介质一定是光
        - 谁: 中际旭创股份有限公司
          原话: 光模块的作用就是光电转换，发送端把电信号转换成光信号，通过光纤传送后，接收端再把光信号转换成电信号。
          出处: 2024年年度报告·释义章节
          锚型: local_file
          锚: corpus/annual-2024/300308/300308__em_中际旭创_em__2024_2024年年度报告.pdf.txt#释义章节·光模块/光通信模块
          说明: 补充光纤型光收发模块的电光转换功能_不支撑内部器件顺序
      录入日期: '2026-08-31'

  - candidate_id: PQ002-KN-C02
    proposed_knowledge_id: KN012
    target_contract:
      target_class: physical_domain_knowledge
      knowledge_yaml_eligible: true
      research_question_ids: [PQ002]
      physical_cell_ids: []
      route_item_ids: []
    entailment_contract:
      atomic_claim: 在CMIS与OSFP所描述的对象中_承载业务数据的高速收发路径与低速管理控制以及供电接地路径是分开的并行路径_后者不是电转光转电功能链上的串行步骤
      claim_class: stable_explanation
      applies_when: 区分CMIS管理通信与OSFP高速收发_低速控制_供电和接地路径
      does_not_apply_when: 推断所有光模块都采用相同管脚_管理控制不重要_或定义具体内部管理电路
      proposed_disposition: ready_for_stable_explanation_review
      evidence:
        - source_id: S1-OIF-CMIS-05.4
          source_type: implementation_agreement_web_snapshot
          locator: corpus/web/2026-08-23/oiforum.com__OIF-CMIS-05.4.pdf#Abstract与印刷页65-67
          supports: two_wire主机到模块通信属于管理接口_Host与Media高速接口承载传输任务
          does_not_support: OSFP具体管脚_所有模块的供电实现_管理路径无关紧要
        - source_id: S3-OSFP-Rev5.22
          source_type: msa_specification_web_snapshot
          locator: corpus/web/2026-08-23/osfpmsa.org__OSFP_Module_Specification_Rev5_22.pdf#印刷页159-160·§15
          supports: edge_connector分别承载高速TX_RX差分对_低速控制_供电和地
          does_not_support: 所有形态都采用OSFP管脚_模块内部管理电路或电源拓扑
      falsifier: 适用规范把低速管理控制或供电接地定义为高速业务数据串行链路的一部分_或目标对象并非这些规范所描述的模块
    append_payload:
      id: KN012
      体系: 物理知识
      研究问题: [PQ002]
      格: []
      标题: 数据、管理和供电是三类并行路径，不要画成一条流水线
      一句话: |
        高速收发信号负责搬运业务数据；低速管理与控制负责配置和监测；电源与地负责供能。
        它们会一起进入模块，但后两类不是“电转光再转电”链条上的处理步骤。
      说细点: |
        一张完整的模块图通常不只有收发箭头。CMIS 另设低速双线通信，让主机管理模块；
        OSFP 的边缘连接器也把高速发送和接收差分对、低速控制、供电和地分开定义。

        因此画功能链时，应把高速业务数据画成主干，把管理、控制和供电画成并行支撑路径。
        如果把 I2C 或 CMIS 管理通信塞在“电信号→光信号”的串行箭头中，就混淆了数据如何传输
        与模块如何被配置、监测和供能。

        这里没有说管理或电源不重要，也没有声称所有光模块都采用 OSFP 的相同管脚定义。
      怎么用它判断: |
        看框图时先给每条线分类：高速业务数据、低速管理/控制、供电/地。
        只有第一类进入收发功能链；其余两类应作为支撑路径单独追踪，并按具体规范核对。
      证据:
        - 谁: Optical Internetworking Forum（OIF）
          原话: （忠实转述，非逐字引文）CMIS 规定主机到模块的双线管理通信，同时把与传输任务相关的 Host Interface 和 Media Interface 作为另一层接口描述。
          出处: OIF-CMIS-05.4·Abstract、§6
          锚型: web_snapshot
          锚:
            原URL: https://www.oiforum.com/wp-content/uploads/OIF-CMIS-05.4.pdf
            存档路径: corpus/web/2026-08-23/oiforum.com__OIF-CMIS-05.4.pdf
            抓取日期: '2026-08-23'
            SHA256: cd57ebb1cfb8e0a9e9c7b63862b5b261855e9b77844f4cf85bd36ea3808911db
          说明: 支撑管理通信与高速任务接口分层
        - 谁: OSFP MSA
          原话: （忠实转述，非逐字引文）OSFP 模块边缘连接器分别定义主机到模块的高速发送差分对、模块到主机的高速接收差分对，以及低速控制信号、供电和地。
          出处: OSFP Module Specification Rev 5.22·§15
          锚型: web_snapshot
          锚:
            原URL: https://www.osfpmsa.org/assets/pdf/OSFP_Module_Specification_Rev5_22.pdf
            存档路径: corpus/web/2026-08-23/osfpmsa.org__OSFP_Module_Specification_Rev5_22.pdf
            抓取日期: '2026-08-23'
            SHA256: c8e80dda50e85b1d4ec96c88642d8a9ed0ed254124f9442f20c51559533850eb
          说明: 只作为OSFP实例_不推广为全部模块的引脚定义
      录入日期: '2026-08-31'

  - candidate_id: PQ002-KN-C03
