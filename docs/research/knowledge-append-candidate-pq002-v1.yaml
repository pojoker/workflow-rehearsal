    entailment_contract:
      atomic_claim: 在OIF共封装框架实例中_EIC可包含驱动激光器或调制器的电子电路以及把探测器光电流变为可用电信号的TIA或后置放大器_OIC或PIC可包含调制器_探测器_波导等光学功能
      claim_class: object_level_candidate
      applies_when: 解释OIF_Co_Packaging_Framework_01.0给出的光引擎内部功能归属示例
      does_not_apply_when: 所有可插拔模块_所有CPO产品_强制BOM_确定的封装位置或器件连接顺序
      proposed_disposition: ready_for_object_level_candidate_review
      evidence:
        - source_id: S4-OIF-Co-Packaging-FD-01.0
          source_type: framework_document_web_snapshot
          locator: corpus/web/2026-08-23/oiforum.com__OIF-Co-Packaging-FD-01.0.pdf#印刷页29-31·Glossary
          supports: EIC_OIC_PIC_Optical_Engine_TIA的条件性功能定义与电光双向转换
          does_not_support: may_contain被解释为must_contain_所有模块采用相同部件_完整BOM或实际产品量产状态
      falsifier: 目标对象不是该OIF框架所述共封装光引擎_或适用版本不再给出这些条件性功能定义_或实物证据表明功能归属不同
    append_payload:
      id: KN013
      体系: 物理知识
      研究问题: [PQ002]
      格: []
      标题: 一个受限的内部例子——CPO 光引擎怎样分担发送和接收功能
      一句话: |
        在 OIF 的共封装光学框架里，电子芯片可以负责驱动发光/调制以及放大探测器输出，
        光学芯片可以承载调制器、探测器和波导；这是框架实例，不是所有光模块的固定零件表。
      说细点: |
        OIF 的 Co-Packaging Framework 把一个光引擎看作电子与光学功能的组合。
        其中，电子集成电路（EIC）可以包含驱动激光器或调制器的电路；在接收方向，
        也可以包含跨阻放大器（TIA）和后置放大器，把光探测器产生的微弱光电流变成可用电信号。
        光学集成电路（OIC）或光子集成电路（PIC）可以包含调制器、光探测器和波导等功能。

        这里最重要的词是“可以包含”。该框架给出了功能如何分工的一种设计空间，
        没有要求所有 CPO 产品必须按同一方式切分，更不能把这张表复制为可插拔光模块的通用 BOM。
      怎么用它判断: |
        看到 EIC、OIC 或 PIC 时，先问来源是在定义一种框架能力，还是披露某个真实产品的部件。
        只有拿到具体产品的框图、拆解或测试证据，才能把“可以包含”升级为“该产品确实包含”。
      证据:
        - 谁: Optical Internetworking Forum（OIF）
          原话: （忠实转述，非逐字引文）EIC 可以包含驱动激光器或调制器的电子电路，也可包含把光探测器光电流转为可用电信号的 TIA/后置放大器；OIC/PIC 可以包含调制器、光探测器、波导等。
          出处: OIF-Co-Packaging-FD-01.0·Glossary
          锚型: web_snapshot
          锚:
            原URL: https://www.oiforum.com/wp-content/uploads/OIF-Co-Packaging-FD-01.0.pdf
            存档路径: corpus/web/2026-08-23/oiforum.com__OIF-Co-Packaging-FD-01.0.pdf
            抓取日期: '2026-08-23'
            SHA256: 1d614845b92471ae50dd1c6d80a4070515bd4ef369ded9d42fe5e3df4c8457af
          说明: 仅支撑OIF共封装框架实例_保留may_contain条件语气
      录入日期: '2026-08-31'

