# ACTIVE_WORKPACK — 用户已授权的当前实施任务

workpack:
  id: CONTROL-DOC-003
  title: 更新会话入口与授权边界
  status: completed
  approved_at: 2026-09-05
  completed_at: 2026-09-05
  owner: 用户
  authorization: 用户确认更新，随后明确要求“自动推送到github 吧”，授权提交并推送本次控制文档更新。

objective:
  - 消除入口和章程中的重复审批与全局停工规则，支持已授权工作持续推进。
  - 保留领域证据边界、canonical 晋升人工裁决和架构准入要求。

baseline:
  execution_repository: /Users/jowang/Downloads/workflow-rehearsal-goal-control
  previous_workpack: AUDIT-DQ-002（已完成；原记录保留在 Git 历史中）

reader_visible_deliverables:
  - AGENTS.md 的授权、读取、长期任务、委派及验证规则
  - docs/control/PROJECT_CHARTER.md 中与入口一致的权限与暂停规则

allowed_write_paths:
  - AGENTS.md
  - docs/control/PROJECT_CHARTER.md
  - docs/control/ACTIVE_WORKPACK.yaml

read_scope:
  allowed:
    - AGENTS.md
    - docs/control/PROJECT_CHARTER.md
    - docs/control/ACTIVE_WORKPACK.yaml
    - README.md 的验证命令
    - 当前工作树状态及本次改动 diff
  forbidden:
    - archive/**
    - 其他仓库及旧 worktree 历史
    - closure-pilot 与状态机材料
    - 完整 agent 轨迹和旧会话全量日志

canonical_policy:
  writable: false

execution_plan:
  - 按用户接受的建议更新入口和章程，记录本次授权。
  - 检查规则一致性、YAML 格式及 diff 范围。
  - 报告改动与验证结果。

non_goals:
  - 不修改代码、测试、canonical、网页或日更流程
  - 不同步其他本地仓库，不合并分支，不纳入原有未跟踪 ZIP
  - 不新增运行时架构或自动状态机

acceptance_criteria:
  - 入口与章程对只读任务、用户授权、工作包同步和局部暂停的规定一致。
  - 保留证据类型分列、人工复核、canonical 晋升授权及架构准入要求。
  - 明确当前任务隔离 worktree 范围、精简交接及按影响验证规则。
  - git diff --check 通过，工作包 YAML 可解析，本次改动只涉及允许路径。

architecture_budget:
  new_relation_types: []
  new_state_machines: []
  new_canonical_schemas: []
  new_engines: []

stop_and_escalate:
  - 需要超出本次授权修改其他文件时，暂停对应写入并报告。
  - 需要改变北极星、晋升领域事实或新增架构时，提交用户裁决。

completion_evidence:
  - 已核对入口与章程的授权、暂停、读取范围及证据边界，规则一致。
  - git diff --check 通过；工作包 YAML 解析与允许路径检查通过。
  - 仅修改三份允许的控制文档，未修改代码、canonical 或网页；原有未跟踪 ZIP 保留。
  - 按文档改动范围验证，未运行领域构建；其他仓库未同步。
