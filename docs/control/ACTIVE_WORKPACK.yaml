execution_plan:
  - 启动前记录目标仓库 HEAD、工作树和 canonical 指纹。
  - 在 cmux 右侧拆分两个终端，分别运行 Kimi 与 Cursor。
  - 等待两路完成；若任一请求扩大范围，停止该路并升级。
  - 检查只产生两份允许报告，并验证 canonical 指纹不变。
  - 执行机器门；机器门只证明结构未受损，不代替审计裁决。
  - 汇总两份报告的一致结论、分歧与 UNKNOWN，不实施修复或消融。

non_goals:
  - 不修复被发现的数据问题
  - 不执行任何消融、schema 合并或迁移
  - 不修改或重新生成九页网页
  - 不修改日更自动化
  - 不把审阅者结论自动晋升为 canonical 事实
  - 不要求两位审阅者形成一致结论

acceptance_criteria:
  - 两份报告均按共同输出合同覆盖 B01-B12 与 H1-H10。
  - 每份报告包含证据、反例、依赖影响、回滚考虑和未解决问题。
  - 两位审阅者在完成前未读取对方输出。
  - 目标仓库除当前工作包和两份报告外无新改动，canonical 指纹前后相同。
  - 最终汇总明确区分一致结论、分歧、证据不足和后续待用户裁决事项。

