    - docs/control/**
    - README.md
    - site/optical-module/**
    - tools/site/**
    - knowledge.yaml
    - points.csv
    - triage.csv
    - route_bom.csv
    - calls/*.csv
    - corpus/_frozen.csv
    - corpus/_restart_watchlist.csv
    - corpus/_fetch_qa.py
    - 用户明确指定的旧九页前端源文件
    - 已识别的 daily-intelligence-mirror 六个有限提交及其文件
  forbidden:
    - archive/**
    - research-metacognition-lab/**
    - closure-pilot 状态机源码、输出或报告
    - 其他无关历史分支和完整 agent 轨迹

canonical_policy:
  writable: false
  protected:
    - knowledge.yaml
    - points.csv
    - edges.csv
    - triage.csv
    - route_bom.csv
    - tree.yaml
    - calls/*.csv
  daily_outputs_are: mirror_or_candidate_only
  promotion: human_review_and_new_user_authorization_required

non_goals:
  - 新增或恢复通用状态机、自动 close/reopen、receipt、snapshot lineage
  - 自动晋升任何国内或海外候选
  - 自动生成 offers_product 或 implements_route
  - 开始 OM-PHYS-001 领域研究
  - 把测试通过表述为领域问题已完成

acceptance_criteria:
  - 前端 manifest 为 9 页、27 章节，且读者页面不引用旧“当前任务控制文稿”。
  - 九页前端构建前后 canonical 指纹不变，站点测试和本地链接检查通过。
  - 国内镜像只写仓库外 state root；源仓库受保护指纹前后相同。
  - 海外镜像只写仓库外 staging/daily；promoted=0，calls canonical 前后相同。
  - 统一日更输出能区分成功、部分失败、缺端点和候选状态。
  - 真实联网试跑完成；失败端点被记录但不会触发 canonical 写入。
  - 仅在上述不变量成立后创建每日自动任务；无实质增量时静默。
  - scan.py --check、render.py --verify、participation.py --check、python -m calls check 全绿。

architecture_budget:
  new_relation_types: []
  new_state_machines: []
  new_canonical_schemas: []
  restored_modules:
    - nine_page_reader
    - domestic_daily_read_only_mirror
    - overseas_daily_read_only_discovery
    - daily_intelligence_assembler

stop_and_escalate:
  - 任一日更命令修改 canonical 或 tracked source files
  - 九页前端需要 closure/state-machine 才能构建
  - 需要自动晋升候选
  - 需要删除旧救援工作区或远端分支
  - 真实抓取要求凭证、验证码或绕过访问控制

